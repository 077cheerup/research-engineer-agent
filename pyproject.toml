[project]
name = "research-engineer-agent"
version = "0.1.0"
description = "Phase 1: a minimal DeepAgents research analysis loop"
requires-python = ">=3.11"
dependencies = [
  "deepagents>=0.4,<0.8",
  "langchain>=1,<2",
  "langchain-openai>=1,<2",
  "python-dotenv>=1,<2",
  "pandas>=2,<4",
  "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
